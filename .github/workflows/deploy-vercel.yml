# Deploy a producción en Vercel usando la CLI (funciona en el plan Hobby).
# Se ejecuta solo con cada push a main, y también a mano desde
# GitHub → Actions → "Deploy a Vercel" → "Run workflow".
name: Deploy a Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy a producción
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
